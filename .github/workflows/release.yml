# A plugin is released when the published pool doesn't have `<id>@<version>.zip` for its manifest version.
# The pool contains all relevant data. Git tags and GitHub releases are created for changelogs only.

name: Release plugins

# main publishes releases (plain versions, the "latest" channel). dev publishes dev builds
# (versions like 1.2.3-dev4, built with -Pdev, which Valenced puts on the "beta" channel).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Branch holding the pool. Set the POOL_BRANCH repository variable to move it.
  POOL_BRANCH: ${{ vars.POOL_BRANCH }}
  # Set the PAGES_BASE_URL repository variable when the pool is served from a custom domain.
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
  POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
  PLAN: ${{ github.workspace }}/releases.json

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a stuck run fails after 30 minutes instead of hanging for hours
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Existing tags, so a re-run doesn't try to recreate one.

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle's downloads (Gradle itself, the Android plugin, Kotlin, libraries) between runs.
      # Without it every run downloads all of that again, which is most of the build time.
      # Main and dev write the cache; anything else only reads it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_name != 'main' && github.ref_name != 'dev' }}

      - run: bun install

      - name: Check out the published pool
        run: .github/scripts/checkout-pool.sh

      - name: Check the version matches this branch
        run: .github/scripts/check-channel.sh

      - name: Plan releases
        id: plan
        run: .github/scripts/plan-releases.sh

      - name: Build plugins
        if: steps.plan.outputs.count != '0'
        run: ./gradlew --build-cache packageAllPlugins ${{ github.ref_name == 'dev' && '-Pdev' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }} # For Gradle to download the API dependency.

      # The zips are also kept on the run page, so anyone with repo access can grab one without a Release.
      - name: Upload plugin zips
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips-${{ github.ref_name }}-run${{ github.run_number }}
          path: build/dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the pool
        if: steps.plan.outputs.count != '0'
        run: .github/scripts/publish-pool.sh

      - name: Tag and write changelogs
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/tag-releases.sh
